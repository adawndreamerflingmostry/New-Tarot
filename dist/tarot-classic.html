<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <title>塔罗 · 抽牌</title>
  <meta name="description" content="一个可以洗牌、结束洗牌、按数量抽牌的交互式塔罗牌程序，每张牌都有独立牌面与完整牌义。">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0820'/%3E%3Cpath d='M32 10l5.4 16.6L54 32l-16.6 5.4L32 54l-5.4-16.6L10 32l16.6-5.4z' fill='%23e2c17c'/%3E%3C/svg%3E">
  <style>
/* ============================================================
   塔罗 · 抽牌  —  样式
   ========================================================== */

:root {
  --bg-0: #05040c;
  --bg-1: #0b0820;
  --gold: #e2c17c;
  --gold-bright: #f6e3b0;
  --gold-soft: #b8944e;
  --ink: #f4ecd8;
  --muted: #a49bb8;
  --line: rgba(226, 193, 124, 0.22);
  --card-w: clamp(92px, 10.4vw, 148px);
  --card-h: calc(var(--card-w) * 1.67);
  --font-display: "Cormorant Garamond", "Baskerville", "Georgia", "Songti SC", "STSong", "SimSun", serif;
  --font-body: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Segoe UI", system-ui, sans-serif;
}

* { box-sizing: border-box; }

html, body { height: 100%; }

body {
  margin: 0;
  min-height: 100%;
  color: var(--ink);
  font-family: var(--font-body);
  background:
    radial-gradient(1100px 760px at 16% 6%, rgba(96, 66, 186, 0.26), transparent 62%),
    radial-gradient(900px 700px at 84% 88%, rgba(186, 124, 58, 0.14), transparent 62%),
    radial-gradient(720px 560px at 52% 46%, rgba(58, 38, 118, 0.32), transparent 70%),
    linear-gradient(180deg, #07050f 0%, #05040c 55%, #060410 100%);
  background-attachment: fixed;
  overflow-x: hidden;
}

body::after {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.55) 100%);
  z-index: 0;
}

#stars {
  position: fixed;
  inset: 0;
  z-index: 0;
  pointer-events: none;
  overflow: hidden;
}

#stars i {
  position: absolute;
  display: block;
  border-radius: 50%;
  background: #fff;
  opacity: 0;
  animation-name: twinkle;
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
}

@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.6); }
  50% { opacity: var(--op, 0.5); transform: scale(1); }
}

/* ---------- 布局 ---------- */
.app {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  min-height: 100dvh;
  padding: clamp(16px, 2.6vw, 34px) clamp(18px, 4.4vw, 64px) clamp(14px, 2vw, 26px);
}

.masthead {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding-bottom: clamp(12px, 1.8vw, 20px);
  border-bottom: 1px solid rgba(226, 193, 124, 0.14);
}

.brand { display: flex; align-items: center; gap: 16px; }

.brand-mark {
  width: 46px;
  height: 46px;
  flex: 0 0 auto;
  display: grid;
  place-items: center;
  border: 1px solid rgba(226, 193, 124, 0.5);
  border-radius: 50%;
  color: var(--gold);
  font-size: 17px;
  background: radial-gradient(circle at 50% 35%, rgba(226, 193, 124, 0.24), transparent 70%);
  box-shadow: 0 0 0 4px rgba(226, 193, 124, 0.05), 0 0 22px -6px rgba(226, 193, 124, 0.5);
}

h1 {
  margin: 0;
  font-family: var(--font-display);
  font-size: clamp(23px, 3vw, 33px);
  font-weight: 500;
  letter-spacing: 0.2em;
  line-height: 1.1;
  text-shadow: 0 0 30px rgba(226, 193, 124, 0.25);
}

h1 span { color: var(--gold); margin: 0 0.1em; }

.tagline {
  margin: 6px 0 0;
  font-size: 11px;
  letter-spacing: 0.34em;
  color: var(--muted);
}

.deck-note {
  margin: 0;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: rgba(164, 155, 184, 0.8);
  white-space: nowrap;
}

.masthead-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}

.mode-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 13px;
  border: 1px solid rgba(226, 193, 124, 0.32);
  border-radius: 999px;
  color: var(--gold);
  font-size: 11.5px;
  letter-spacing: 0.1em;
  text-decoration: none;
  transition: 0.2s ease;
}

.mode-link:hover {
  border-color: rgba(226, 193, 124, 0.75);
  background: rgba(226, 193, 124, 0.09);
  box-shadow: 0 0 18px -6px rgba(226, 193, 124, 0.7);
}

@media (max-width: 560px) {
  .masthead { flex-wrap: wrap; }
  .masthead-right { flex-direction: row; align-items: center; width: 100%; justify-content: flex-end; }
  .masthead-right .deck-note { display: none; }
  .mode-link { font-size: 10.5px; padding: 5px 11px; }
}

/* ---------- 控制条 ---------- */
.controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: center;
  gap: 14px 18px;
  padding: clamp(14px, 2vw, 22px) 0 clamp(4px, 1vw, 10px);
}

.btn-group, .draw-group { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; justify-content: center; }

.control-divider {
  width: 1px;
  height: 26px;
  background: linear-gradient(180deg, transparent, rgba(226, 193, 124, 0.35), transparent);
}

.btn {
  position: relative;
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 11px 20px;
  border-radius: 999px;
  border: 1px solid transparent;
  background: transparent;
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 13.5px;
  letter-spacing: 0.12em;
  cursor: pointer;
  transition: transform 0.18s ease, box-shadow 0.25s ease, background 0.25s ease, color 0.25s ease, border-color 0.25s ease;
  white-space: nowrap;
}

.btn:active:not(:disabled) { transform: translateY(1px) scale(0.985); }
.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

.btn:disabled { opacity: 0.32; cursor: not-allowed; }

.btn-icon { font-size: 10px; color: var(--gold); transition: transform 0.5s ease; }
#shuffleBtn:hover:not(:disabled) .btn-icon { transform: rotate(180deg); }

.btn-gold {
  color: var(--gold-bright);
  border-color: rgba(226, 193, 124, 0.45);
  background: linear-gradient(180deg, rgba(226, 193, 124, 0.16), rgba(226, 193, 124, 0.03));
  box-shadow: inset 0 1px 0 rgba(255, 246, 214, 0.12), 0 8px 26px -14px rgba(226, 193, 124, 0.8);
}

.btn-gold:hover:not(:disabled) {
  border-color: rgba(226, 193, 124, 0.8);
  box-shadow: inset 0 1px 0 rgba(255, 246, 214, 0.18), 0 10px 34px -12px rgba(226, 193, 124, 0.95);
}

.btn-gold.is-busy {
  animation: busyGlow 1.6s ease-in-out infinite;
}

@keyframes busyGlow {
  0%, 100% { box-shadow: 0 0 0 0 rgba(226, 193, 124, 0.0), inset 0 1px 0 rgba(255, 246, 214, 0.14); }
  50% { box-shadow: 0 0 30px -4px rgba(226, 193, 124, 0.55), inset 0 1px 0 rgba(255, 246, 214, 0.22); }
}

.btn-line {
  border-color: rgba(255, 255, 255, 0.16);
  color: var(--ink);
  background: rgba(255, 255, 255, 0.03);
}

.btn-line:hover:not(:disabled) {
  border-color: rgba(226, 193, 124, 0.55);
  color: var(--gold-bright);
}

.btn-primary {
  color: #1c1206;
  font-weight: 600;
  border-color: rgba(255, 236, 190, 0.55);
  background: linear-gradient(180deg, #f3dfa9 0%, #e2c17c 48%, #b8944e 100%);
  box-shadow: 0 10px 30px -12px rgba(226, 193, 124, 0.9), inset 0 1px 0 rgba(255, 255, 255, 0.5);
}

.btn-primary:hover:not(:disabled) {
  box-shadow: 0 14px 38px -12px rgba(240, 207, 130, 1), inset 0 1px 0 rgba(255, 255, 255, 0.65);
}

.btn-ghost { color: var(--muted); font-size: 12.5px; padding: 9px 14px; }
.btn-ghost:hover:not(:disabled) { color: var(--ink); background: rgba(255, 255, 255, 0.05); }

/* 数量输入 */
.count-field {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 5px 10px 5px 14px;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.03);
}

.count-label { font-size: 11.5px; letter-spacing: 0.16em; color: var(--muted); white-space: nowrap; }

.stepper { display: flex; align-items: center; gap: 2px; }

.step {
  width: 26px;
  height: 26px;
  display: grid;
  place-items: center;
  border: 1px solid rgba(255, 255, 255, 0.14);
  border-radius: 8px;
  background: transparent;
  color: var(--ink);
  font-size: 15px;
  line-height: 1;
  cursor: pointer;
  transition: 0.18s ease;
}

.step:hover:not(:disabled) { border-color: rgba(226, 193, 124, 0.7); color: var(--gold); }
.step:disabled { opacity: 0.3; cursor: not-allowed; }

#countInput {
  width: 40px;
  padding: 0;
  border: 0;
  background: transparent;
  color: var(--gold-bright);
  font-family: var(--font-display);
  font-size: 21px;
  text-align: center;
  appearance: textfield;
}

#countInput:focus { outline: none; }
#countInput::-webkit-outer-spin-button,
#countInput::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

/* ---------- 牌桌 ---------- */
.table {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(170px, 216px) minmax(0, 1fr);
  gap: clamp(20px, 3.6vw, 52px);
  align-items: center;
  width: 100%;
  max-width: 1120px;
  margin-inline: auto;
  padding: clamp(6px, 1.6vw, 18px) 0;
}

.deck-panel {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
}

.deck-stage {
  position: relative;
  width: var(--card-w);
  height: var(--card-h);
  display: grid;
  place-items: center;
  margin-inline: auto;
}

.deck-stage::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -34px;
  width: 150%;
  height: 48px;
  transform: translateX(-50%);
  background: radial-gradient(ellipse at center, rgba(226, 193, 124, 0.2), transparent 68%);
  pointer-events: none;
  transition: opacity 0.4s ease;
}

.deck {
  position: relative;
  width: 100%;
  height: 100%;
  filter: drop-shadow(0 26px 24px rgba(0, 0, 0, 0.75));
}

.deck-card {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  transform: translate(var(--ox), var(--oy)) rotate(var(--rot));
  transition: transform 0.7s cubic-bezier(0.22, 0.8, 0.24, 1), box-shadow 0.4s ease;
  will-change: transform;
}

.deck-card svg {
  display: block;
  width: 100%;
  height: 100%;
  border-radius: 12px;
}

/* 洗牌动画 */
.deck.is-shuffling .deck-card {
  animation-name: riffle;
  animation-duration: var(--dur, 1.7s);
  animation-timing-function: ease-in-out;
  animation-iteration-count: infinite;
  animation-delay: var(--delay, 0s);
}

@keyframes riffle {
  0%, 100% { transform: translate(var(--ox), var(--oy)) rotate(var(--rot)); }
  14% { transform: translate(calc(var(--dir) * 88px), -20px) rotate(calc(var(--dir) * 15deg)); }
  38% { transform: translate(calc(var(--dir) * 22px), -50px) rotate(calc(var(--dir) * -7deg)); }
  56% { transform: translate(calc(var(--dir) * -76px), -26px) rotate(calc(var(--dir) * -14deg)); }
  76% { transform: translate(calc(var(--dir) * -12px), -4px) rotate(calc(var(--dir) * 3deg)); }
}

@keyframes cutDeck {
  0% { transform: translate(var(--ox), var(--oy)) rotate(var(--rot)); }
  26% { transform: translate(calc((var(--i) - 14) * 1.4px), -40px) rotate(calc(var(--dir) * 5deg)); }
  56% { transform: translate(calc(var(--dir) * 66px), -10px) rotate(calc(var(--dir) * -9deg)); }
  100% { transform: translate(var(--ox), var(--oy)) rotate(var(--rot)); }
}

.deck.is-settling .deck-card {
  animation: cutDeck 0.95s cubic-bezier(0.3, 0.85, 0.25, 1) both;
}

.deck.is-ready .deck-card {
  box-shadow: 0 0 0 1px rgba(226, 193, 124, 0.18), 0 0 22px -8px rgba(226, 193, 124, 0.45);
}

.deck.is-ready::after {
  content: "";
  position: absolute;
  inset: -7px;
  border-radius: 16px;
  border: 1px solid rgba(226, 193, 124, 0.28);
  animation: readyPulse 2.6s ease-in-out infinite;
  pointer-events: none;
}

@keyframes readyPulse {
  0%, 100% { opacity: 0.35; transform: scale(1); }
  50% { opacity: 0.9; transform: scale(1.012); }
}

.deck-wave {
  position: absolute;
  inset: 0;
  border-radius: 16px;
  border: 1px solid rgba(226, 193, 124, 0.75);
  pointer-events: none;
  animation: waveOut 1.3s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}

@keyframes waveOut {
  0% { transform: scale(1); opacity: 0.9; }
  100% { transform: scale(2); opacity: 0; }
}

.deck-meta {
  display: flex;
  align-items: baseline;
  gap: 6px;
  margin-top: clamp(18px, 2.4vw, 30px);
}

.deck-count {
  font-family: var(--font-display);
  font-size: 30px;
  line-height: 1;
  color: var(--gold);
  letter-spacing: 0.04em;
}

.deck-count.pop { animation: countPop 0.36s ease; }

@keyframes countPop {
  0% { transform: scale(1); }
  45% { transform: scale(1.22); color: var(--gold-bright); }
  100% { transform: scale(1); }
}

.deck-label { font-size: 11px; letter-spacing: 0.14em; color: var(--muted); }

.deck-state {
  margin-top: 8px;
  font-size: 11px;
  letter-spacing: 0.24em;
  color: rgba(184, 148, 78, 0.9);
  text-transform: uppercase;
  min-height: 16px;
}

/* ---------- 牌阵 ---------- */
.spread {
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: calc(var(--card-h) + 150px);
  min-width: 0;
}

.spread-empty {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 20px;
  color: rgba(164, 155, 184, 0.75);
  font-size: 12.5px;
  letter-spacing: 0.16em;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

.spread-empty[hidden] { display: none; }

.spread-empty p { margin: 0; }

.empty-card {
  width: calc(var(--card-w) * 0.92);
  aspect-ratio: 200 / 334;
  display: grid;
  place-items: center;
  border: 1px dashed rgba(226, 193, 124, 0.32);
  border-radius: 12px;
  color: rgba(226, 193, 124, 0.55);
  font-size: 20px;
  background: radial-gradient(circle at 50% 40%, rgba(226, 193, 124, 0.09), transparent 70%);
  animation: emptyFloat 5s ease-in-out infinite;
}

@keyframes emptyFloat {
  0%, 100% { transform: translateY(0); opacity: 0.75; }
  50% { transform: translateY(-7px); opacity: 1; }
}

.fan {
  position: relative;
  width: 100%;
  height: calc(var(--card-h) + 56px);
  flex: 0 0 auto;
}

.slot {
  position: absolute;
  left: 50%;
  top: 8px;
  width: var(--card-w);
  height: var(--card-h);
  padding: 0;
  border: 0;
  background: none;
  transform-origin: 50% 50%;
  cursor: pointer;
  perspective: 1400px;
  outline: none;
  -webkit-tap-highlight-color: transparent;
}

.slot:hover { z-index: 80 !important; }

.card-3d {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.slot:hover .card-3d,
.slot:focus-visible .card-3d { transform: translateY(-20px) scale(1.05); }

.slot:focus-visible .face { box-shadow: 0 0 0 2px var(--gold), 0 22px 40px -16px #000; }

.card-inner {
  position: absolute;
  inset: 0;
  transform-style: preserve-3d;
  transform: rotateY(180deg);
  transition: transform 0.82s cubic-bezier(0.32, 0.86, 0.3, 1.04);
}

.card-inner.revealed { transform: rotateY(0deg); }

.fan.instant .card-inner { transition: none; }

.face {
  position: absolute;
  inset: 0;
  border-radius: 12px;
  overflow: hidden;
  backface-visibility: hidden;
  -webkit-backface-visibility: hidden;
  box-shadow: 0 18px 34px -16px rgba(0, 0, 0, 0.95), 0 0 0 1px rgba(255, 255, 255, 0.045);
}

.face.back { transform: rotateY(180deg); }

.face svg { display: block; width: 100%; height: 100%; }

.face.front.reversed .art { transform: rotate(180deg); transform-origin: 50% 50%; }

/* 翻牌粒子 */
.sparks {
  position: absolute;
  inset: 0;
  z-index: 40;
  pointer-events: none;
}

.sparks i {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 4px;
  height: 4px;
  margin: -2px 0 0 -2px;
  border-radius: 50%;
  background: #ffe9b0;
  box-shadow: 0 0 9px 2px rgba(255, 214, 128, 0.65);
  opacity: 0;
  animation: spark 0.95s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}

@keyframes spark {
  0% { transform: translate(0, 0) scale(0.4); opacity: 1; }
  70% { opacity: 0.9; }
  100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
}

/* 抽出的牌列表 */
.drawn-list {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin: 6px 0 0;
  padding: 0;
  list-style: none;
  min-height: 36px;
}

.drawn-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 13px 6px 8px;
  border-radius: 999px;
  border: 1px solid rgba(226, 193, 124, 0.22);
  background: rgba(255, 255, 255, 0.028);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 12.5px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: 0.2s ease;
  animation: chipIn 0.4s ease both;
}

@keyframes chipIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: none; }
}

.drawn-chip:hover {
  border-color: var(--accent, var(--gold));
  box-shadow: 0 0 18px -6px var(--accent, var(--gold));
  transform: translateY(-1px);
}

.chip-idx {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: rgba(226, 193, 124, 0.16);
  color: var(--gold);
  font-size: 10px;
  font-family: var(--font-display);
}

.chip-ori { font-size: 10.5px; color: var(--muted); letter-spacing: 0.1em; }
.chip-ori.rev { color: #e09280; }

/* ---------- 状态与提示 ---------- */
.status {
  margin: 4px 0 0;
  min-height: 20px;
  text-align: center;
  font-size: 12.5px;
  letter-spacing: 0.08em;
  color: var(--muted);
  transition: color 0.3s ease;
}

.status[data-tone="live"] { color: var(--gold); }
.status[data-tone="ready"] { color: var(--gold-bright); }
.status[data-tone="done"] { color: #bfe3c8; }
.status[data-tone="warn"] { color: #e3a98a; }

.shortcuts {
  margin: 0;
  text-align: center;
  font-size: 10.5px;
  letter-spacing: 0.16em;
  color: rgba(164, 155, 184, 0.5);
}

/* ---------- 牌义弹层 ---------- */
.modal {
  position: fixed;
  inset: 0;
  z-index: 100;
  display: grid;
  place-items: center;
  padding: clamp(14px, 3vw, 40px);
  background: rgba(4, 3, 10, 0.72);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  opacity: 0;
  transition: opacity 0.28s ease;
}

.modal[hidden] { display: none; }
.modal.open { opacity: 1; }

.modal-inner {
  position: relative;
  display: grid;
  grid-template-columns: auto minmax(260px, 400px);
  gap: clamp(20px, 3.6vw, 46px);
  align-items: center;
  width: min(920px, 100%);
  max-height: 92dvh;
  overflow: auto;
  padding: clamp(20px, 3vw, 34px);
  border-radius: 22px;
  border: 1px solid rgba(226, 193, 124, 0.28);
  background:
    radial-gradient(700px 380px at 12% 0%, rgba(96, 66, 186, 0.22), transparent 65%),
    linear-gradient(160deg, rgba(23, 17, 44, 0.97), rgba(8, 6, 18, 0.99));
  box-shadow: 0 50px 90px -40px #000, inset 0 1px 0 rgba(255, 255, 255, 0.05);
  transform: translateY(16px) scale(0.985);
  transition: transform 0.34s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.modal.open .modal-inner { transform: none; }

.modal-close {
  position: absolute;
  top: 14px;
  right: 16px;
  width: 34px;

  function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function $(sel) { return document.querySelector(sel); }

  /* ============================================================
   * 3. 应用状态
   * ========================================================== */
  const state = {
    phase: 'idle',          /* idle | shuffling | settling | ready | drawing | drawn */
    order: DECK.map(function (c) { return c.uid; }),
    drawn: [],
    nodes: [],
    shuffleTimer: null,
    shuffleCount: 0,
    activeIdx: -1
  };

  const els = {};
  const VISUAL_DECK = 28;

  /* ============================================================
   * 4. 启动
   * ========================================================== */
  function init() {
    if (!document.getElementById('deck')) return;
    els.deck = $('#deck');
    els.deckStage = $('#deckStage');
    els.deckCount = $('#deckCount');
    els.deckState = $('#deckState');
    els.fan = $('#fan');
    els.spread = $('#spread');
    els.spreadEmpty = $('#spreadEmpty');
    els.drawnList = $('#drawnList');
    els.status = $('#status');
    els.shuffleBtn = $('#shuffleBtn');
    els.stopBtn = $('#stopBtn');
    els.drawBtn = $('#drawBtn');
    els.resetBtn = $('#resetBtn');
    els.countInput = $('#countInput');
    els.minusBtn = $('#minusBtn');
    els.plusBtn = $('#plusBtn');
    els.modal = $('#modal');
    els.modalCard = $('#modalCard');
    els.modalInfo = $('#modalInfo');
    els.modalClose = $('#modalClose');

    buildStars();
    renderDeckStack();
    bindEvents();
    resetAll(true);
    updateButtons();
    applyDemo();
  }

  function buildStars() {
    const host = $('#stars');
    if (!host || REDUCED) return;
    let html = '';
    for (let i = 0; i < 150; i++) {
      const x = Math.random() * 100;
      const y = Math.random() * 100;
      const size = Math.random() < 0.82 ? 1 : 2;
      const dur = 3 + Math.random() * 6;
      const delay = -Math.random() * 9;
      const op = 0.2 + Math.random() * 0.6;
      html += '<i style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%;width:' + size + 'px;height:' + size +
        'px;--op:' + op.toFixed(2) + ';animation-duration:' + dur.toFixed(1) + 's;animation-delay:' + delay.toFixed(1) + 's"></i>';
    }
    host.innerHTML = html;
  }

  function renderDeckStack() {
    const rnd = mulberry32(20261027);
    let html = '';
    for (let i = 0; i < VISUAL_DECK; i++) {
      const t = i / (VISUAL_DECK - 1);
      const ox = ((t - 0.5) * 8 + (rnd() - 0.5) * 2).toFixed(2);
      const oy = ((0.5 - t) * 16 + (rnd() - 0.5) * 2).toFixed(2);
      const rot = ((rnd() - 0.5) * 2.2).toFixed(2);
      const dir = i < VISUAL_DECK / 2 ? -1 : 1;
      html += '<div class="deck-card" style="--i:' + i + ';--ox:' + ox + 'px;--oy:' + oy + 'px;--rot:' + rot +
        'deg;--dir:' + dir + ';--delay:' + (-i * 0.055).toFixed(2) + 's;--dur:' + (1.5 + rnd() * 0.5).toFixed(2) +
        's;z-index:' + i + '">' + cardBackSVG() + '</div>';
    }
    els.deck.innerHTML = html;
  }

  /* ============================================================
   * 5. 状态与按钮
   * ========================================================== */
  function setStatus(text, tone) {
    els.status.textContent = text;
    els.status.dataset.tone = tone || '';
  }

  function updateButtons() {
    const p = state.phase;
    els.shuffleBtn.disabled = (p === 'shuffling' || p === 'settling' || p === 'drawing');
    els.stopBtn.disabled = (p !== 'shuffling');
    els.drawBtn.disabled = (p !== 'ready');
    els.resetBtn.disabled = (p === 'shuffling' || p === 'settling' || p === 'drawing');
    els.shuffleBtn.textContent = p === 'shuffling' ? '洗牌中…' : '开始洗牌';
    els.shuffleBtn.classList.toggle('is-busy', p === 'shuffling');
    els.countInput.disabled = (p === 'shuffling' || p === 'settling' || p === 'drawing');
    els.minusBtn.disabled = els.countInput.disabled;
    els.plusBtn.disabled = els.countInput.disabled;
  }

  function updateDeckCount() {
    const left = state.order.length;
    els.deckCount.textContent = left;
    els.deckCount.classList.remove('pop');
    void els.deckCount.offsetWidth;
    els.deckCount.classList.add('pop');
  }

  /* ============================================================
   * 6. 洗牌
   * ========================================================== */
  function startShuffle() {
    if (state.phase === 'shuffling' || state.phase === 'settling' || state.phase === 'drawing') return;
    hardReset();

    state.phase = 'shuffling';
    state.shuffleCount = 0;
    shuffle(state.order);

    els.deck.classList.remove('is-ready', 'is-settling');
    els.deck.classList.add('is-shuffling');
    els.deckState.textContent = '洗牌中…';
    updateButtons();
    setStatus('正在洗牌… 静下心，想着你的问题。牌停下的时候，就是答案开始的地方。', 'live');

    state.shuffleTimer = setInterval(function () {
      shuffle(state.order);
      state.shuffleCount++;
      els.deckState.textContent = '洗牌中 ×' + state.shuffleCount;
    }, 460);
  }

  function stopShuffle() {
    if (state.phase !== 'shuffling') return;
    clearInterval(state.shuffleTimer);
    state.shuffleTimer = null;
    state.phase = 'settling';
    shuffle(state.order);
    els.deck.classList.remove('is-shuffling');
    els.deck.classList.add('is-settling');
    els.deckState.textContent = '收牌…';
    updateButtons();
    setStatus('收牌，切牌，牌堆安静下来……', 'live');

    setTimeout(function () {
      els.deck.classList.remove('is-settling');
      els.deck.classList.add('is-ready');
      state.phase = 'ready';
      els.deckState.textContent = '已洗好';
      updateButtons();
      setStatus('牌已洗好。选择抽牌数量，然后点击「抽牌」。', 'ready');
      pulseRing();
    }, REDUCED ? 60 : 950);
  }

  function pulseRing() {
    if (REDUCED) return;
    const ring = document.createElement('div');
    ring.className = 'deck-wave';
    els.deckStage.appendChild(ring);
    setTimeout(function () { ring.remove(); }, 1400);
  }

  /* ============================================================
   * 7. 抽牌
   * ========================================================== */
  async function drawCards(opts) {
    const instant = !!(opts && opts.instant);
    if (state.phase !== 'ready') return;

    const inputVal = parseInt(els.countInput.value, 10);
    const want = clamp(isNaN(inputVal) ? 1 : inputVal, 1, MAX_DRAW);
    const n = Math.min(want, state.order.length);
    if (!n) {
      setStatus('牌堆空了，点击「重置」重新开始。', 'warn');
      return;
    }
    if (n < want) setStatus('牌堆只剩 ' + n + ' 张，就抽这些吧。', 'warn');

    state.phase = 'drawing';
    updateButtons();
    setStatus('抽 ' + n + ' 张牌…', 'live');

    const uids = state.order.slice(0, n);
    state.order = state.order.slice(n);
    updateDeckCount();

    state.drawn = uids.map(function (uid, i) {
      const card = Object.assign({}, DECK[uid]);
      card.reversed = randInt(2) === 1;
      card.position = i + 1;
      return card;
    });

    els.fan.classList.toggle('instant', instant || REDUCED);
    renderDrawnCards(state.drawn);
    layoutFan();
    els.spreadEmpty.hidden = true;
    els.deck.classList.remove('is-ready');

    if (instant || REDUCED) {
      state.nodes.forEach(function (node) { node.inner.classList.add('revealed'); });
      await wait(30);
      finishDraw(n);
      return;
    }

    await dealAnimation();
    await revealAnimation();
    finishDraw(n);
  }

  function renderDrawnCards(cards) {
    els.fan.innerHTML = '';
    state.nodes = [];
    const frag = document.createDocumentFragment();
    cards.forEach(function (card, i) {
      const slot = document.createElement('button');
      slot.type = 'button';
      slot.className = 'slot';
      slot.dataset.idx = String(i);
      slot.setAttribute('aria-label', '第 ' + (i + 1) + ' 张：' + card.name + '，' + (card.reversed ? '逆位' : '正位'));
      slot.innerHTML =
        '<span class="card-3d"><span class="card-inner">' +
        '<span class="face front' + (card.reversed ? ' reversed' : '') + '">' + cardFaceSVG(card) + '</span>' +
        '<span class="face back">' + cardBackSVG() + '</span>' +
        '</span></span>';
      const node = {
        slot: slot,
        card: card,
        rot: 0,
        card3d: slot.querySelector('.card-3d'),
        inner: slot.querySelector('.card-inner')
      };
      slot.addEventListener('click', function () { openModal(i); });
      state.nodes.push(node);
      frag.appendChild(slot);
    });
    els.fan.appendChild(frag);
  }

  function fanMetrics(n) {
    const probe = state.nodes[0] && state.nodes[0].slot;
    const cardW = (probe && probe.offsetWidth) || 120;
    const box = els.fan.getBoundingClientRect();
    const avail = Math.max(box.width - 24, cardW);
    const gap = n > 1 ? Math.min(cardW * 0.72, Math.max(cardW * 0.3, (avail - cardW) / (n - 1))) : 0;
    const step = n > 1 ? Math.min(9.5, 44 / (n - 1)) : 0;
    return { cardW: cardW, gap: gap, step: step, total: gap * (n - 1) };
  }

  function layoutFan() {
    const n = state.nodes.length;
    if (!n) return;
    const m = fanMetrics(n);
    state.nodes.forEach(function (node, i) {
      const x = -m.total / 2 + m.gap * i;
      const rot = (i - (n - 1) / 2) * m.step;
      const dist = Math.abs(i - (n - 1) / 2) / Math.max((n - 1) / 2, 1);
      const lift = dist * dist * 20;
      node.rot = rot;
      node.slot.style.transform = 'translate(-50%, 0) translate(' + x.toFixed(2) + 'px,' + lift.toFixed(2) + 'px) rotate(' + rot.toFixed(2) + 'deg)';
      node.slot.style.zIndex = String(10 + i);
    });
  }

  function dealAnimation() {
    const deckRect = els.deck.getBoundingClientRect();
    return Promise.all(state.nodes.map(function (node, i) {
      const r = node.slot.getBoundingClientRect();
      const dx = (deckRect.left + deckRect.width / 2) - (r.left + r.width / 2);
      const dy = (deckRect.top + deckRect.height / 2) - (r.top + r.height / 2);
      const sc = deckRect.width / (node.slot.offsetWidth || r.width);
      const a = (-node.rot * Math.PI) / 180;
      const lx = dx * Math.cos(a) - dy * Math.sin(a);
      const ly = dx * Math.sin(a) + dy * Math.cos(a);
      const anim = node.card3d.animate([
        { transform: 'translate(' + lx.toFixed(1) + 'px,' + ly.toFixed(1) + 'px) scale(' + sc.toFixed(3) + ') rotate(' + (-node.rot).toFixed(2) + 'deg)', opacity: 0.92 },
        { transform: 'translate(0,0) scale(1) rotate(0deg)', opacity: 1 }
      ], {
        duration: 620,
        delay: i * 85,
        easing: 'cubic-bezier(.2,.78,.28,1)',
        fill: 'backwards'
      });
      return anim.finished.catch(function () { });
    }));
  }

  function revealAnimation() {
    const step = 130;
    state.nodes.forEach(function (node, i) {
      setTimeout(function () {
        node.inner.classList.add('revealed');
        sparks(node.slot);
      }, 60 + i * step);
    });
    return wait(60 + (state.nodes.length - 1) * step + (REDUCED ? 0 : 500));
  }

  function finishDraw(n) {
    state.phase = 'drawn';
    updateButtons();
    setStatus('已抽出 ' + n + ' 张牌。点击任意一张牌，查看它的完整牌义。', 'done');
    els.deckState.textContent = '已抽 ' + n + ' 张';
    renderDrawnList();
  }

  function renderDrawnList() {
    els.drawnList.innerHTML = state.drawn.map(function (card, i) {
      const pal = T.palette(card);
      return '<li><button type="button" class="drawn-chip" data-idx="' + i + '" style="--accent:' + pal.accent + '">' +
        '<span class="chip-idx">' + (i + 1) + '</span>' +
        '<span class="chip-name">' + card.name + '</span>' +
        '<span class="chip-ori' + (card.reversed ? ' rev' : '') + '">' + (card.reversed ? '逆位' : '正位') + '</span>' +
        '</button></li>';
    }).join('');
    els.drawnList.querySelectorAll('.drawn-chip').forEach(function (b) {
      b.addEventListener('click', function () { openModal(parseInt(b.dataset.idx, 10)); });
    });
  }

  function sparks(host) {
    if (REDUCED) return;
    const wrap = document.createElement('span');
    wrap.className = 'sparks';
    let inner = '';
    for (let i = 0; i < 9; i++) {
      const a = Math.random() * Math.PI * 2;
      const d = 26 + Math.random() * 46;
      inner += '<i style="--tx:' + (Math.cos(a) * d).toFixed(1) + 'px;--ty:' + (Math.sin(a) * d).toFixed(1) +
        'px;animation-delay:' + (Math.random() * 130).toFixed(0) + 'ms"></i>';
    }
    wrap.innerHTML = inner;
    host.appendChild(wrap);
    setTimeout(function () { wrap.remove(); }, 1300);
  }

  /* ============================================================
   * 8. 重置
   * ========================================================== */
  function hardReset() {
    clearInterval(state.shuffleTimer);
    state.shuffleTimer = null;
    state.drawn = [];
    state.nodes = [];
    state.order = DECK.map(function (c) { return c.uid; });
    els.fan.innerHTML = '';
    els.fan.classList.remove('instant');
    els.drawnList.innerHTML = '';
    els.spreadEmpty.hidden = false;
    updateDeckCount();
    els.deck.classList.remove('is-shuffling', 'is-settling', 'is-ready');
    if (!els.modal.hidden) {
      els.modal.classList.remove('open');
      els.modal.hidden = true;
      document.body.classList.remove('modal-open');
    }
  }

  function resetAll(silent) {
    hardReset();
    state.phase = 'idle';
    els.deckState.textContent = '待洗牌';
    updateButtons();
    if (!silent) setStatus('点击「开始洗牌」，让牌堆动起来。', '');
  }

  /* ============================================================
   * 9. 牌义弹层
   * ========================================================== */
  function openModal(idx) {
    const card = state.drawn[idx];
    if (!card) return;
    state.activeIdx = idx;
    const pal = T.palette(card);
    const ori = card.reversed ? '逆位' : '正位';
    const other = card.reversed ? '正位' : '逆位';
    const kw = card.reversed ? card.keywords.reversed : card.keywords.upright;
    const meaning = card.reversed ? card.meaning.reversed : card.meaning.upright;
    const otherKw = card.reversed ? card.keywords.upright : card.keywords.reversed;

    els.modal.style.setProperty('--accent', pal.accent);
    els.modalCard.innerHTML = '<div class="modal-art' + (card.reversed ? ' reversed' : '') + '">' + cardFaceSVG(card) + '</div>';

    const meta = card.arcana === 'major'
      ? '大阿卡纳 · ' + card.rankLabel + ' · ' + card.element + ' · ' + card.astro
      : '小阿卡纳 · ' + T.SUITS[card.suit].name + ' · ' + T.SUITS[card.suit].theme + ' · ' + card.element;

    els.modalInfo.innerHTML =
      '<p class="m-kicker">第 ' + (idx + 1) + ' 张 · ' + (card.reversed ? '逆位' : '正位') + '</p>' +
      '<h2 class="m-title">' + card.name + '<span class="m-en">' + card.en + '</span></h2>' +
      '<p class="m-meta">' + meta + '</p>' +
      '<div class="m-badge ' + (card.reversed ? 'rev' : '') + '">' + ori + '</div>' +
      '<div class="m-chips">' + kw.map(function (k) { return '<span>' + k + '</span>'; }).join('') + '</div>' +
      '<h3 class="m-sub">牌义</h3>' +
      '<p class="m-meaning">' + meaning + '</p>' +
      '<p class="m-other"><b>另一面 · ' + other + '</b>' + otherKw.join(' · ') + '</p>';

    els.modal.hidden = false;
    document.body.classList.add('modal-open');
    requestAnimationFrame(function () { els.modal.classList.add('open'); });
    els.modalClose.focus({ preventScroll: true });
  }

  function closeModal() {
    if (els.modal.hidden) return;
    els.modal.classList.remove('open');
    document.body.classList.remove('modal-open');
    const slot = state.nodes[state.activeIdx];
    setTimeout(function () {
      els.modal.hidden = true;
      if (slot) slot.slot.focus({ preventScroll: true });
    }, 260);
  }

  /* ============================================================
   * 10. 事件绑定
   * ========================================================== */
  function bindEvents() {
    els.shuffleBtn.addEventListener('click', startShuffle);
    els.stopBtn.addEventListener('click', stopShuffle);
    els.drawBtn.addEventListener('click', function () { drawCards(); });
    els.resetBtn.addEventListener('click', function () {
      resetAll(false);
      setStatus('已重置。新的问题，从洗牌开始。', '');
    });

    els.minusBtn.addEventListener('click', function () { stepCount(-1); });
    els.plusBtn.addEventListener('click', function () { stepCount(1); });
    els.countInput.addEventListener('change', normalizeCount);
    els.countInput.addEventListener('blur', normalizeCount);
    els.countInput.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !els.drawBtn.disabled) drawCards();
    });

    els.modalClose.addEventListener('click', closeModal);
    els.modal.addEventListener('click', function (e) {
      if (e.target === els.modal) closeModal();
    });

    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') { closeModal(); return; }
      if (!els.modal.hidden) return;
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea' || e.metaKey || e.ctrlKey || e.altKey) return;
      if (tag === 'button' && (e.key === ' ' || e.key === 'Enter')) return;
      if (e.key === ' ' || e.code === 'Space') {
        if (state.phase === 'shuffling') { e.preventDefault(); stopShuffle(); }
      } else if (e.key === 's' || e.key === 'S') {
        if (state.phase === 'shuffling') stopShuffle(); else startShuffle();
      } else if (e.key === 'd' || e.key === 'D') {
        if (!els.drawBtn.disabled) drawCards();
      } else if (e.key === 'r' || e.key === 'R') {
        if (!els.resetBtn.disabled) { resetAll(false); setStatus('已重置。新的问题，从洗牌开始。', ''); }
      }
    });

    let resizeTimer = null;
    window.addEventListener('resize', function () {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function () {
        if (state.nodes.length) layoutFan();
      }, 140);
    });
  }

  function normalizeCount() {
    const v = parseInt(els.countInput.value, 10);
    els.countInput.value = String(clamp(isNaN(v) ? 1 : v, 1, MAX_DRAW));
  }

  function stepCount(delta) {
    normalizeCount();
    const v = parseInt(els.countInput.value, 10) + delta;
    els.countInput.value = String(clamp(v, 1, MAX_DRAW));
  }

  /* ============================================================
   * 11. 演示状态（?demo=shuffling|ready|drawn&n=3），便于截图自检
   * ========================================================== */
  function applyDemo() {
    const params = new URLSearchParams(location.search);
    const demo = params.get('demo');
    if (!demo) return;
    const n = clamp(parseInt(params.get('n') || '3', 10) || 3, 1, MAX_DRAW);
    els.countInput.value = String(n);

    if (demo === 'ready') {
      state.phase = 'ready';
      els.deck.classList.add('is-ready');
      els.deckState.textContent = '已洗好';
      updateButtons();
      setStatus('牌已洗好。选择抽牌数量，然后点击「抽牌」。', 'ready');
    } else if (demo === 'shuffling') {
      startShuffle();
    } else if (demo === 'drawn') {
      state.phase = 'ready';
      els.deck.classList.add('is-ready');
      updateButtons();
      drawCards({ instant: true });
      const openIdx = parseInt(params.get('open') || '-1', 10);
      if (openIdx >= 0) setTimeout(function () { openModal(openIdx); }, 420);
    }
  }

  /* 便于调试与二次开发 */
  window.TAROT_UI = {
    face: cardFaceSVG,
    back: cardBackSVG,
    deck: DECK,
    model: T,
    state: state,
    startShuffle: startShuffle,
    stopShuffle: stopShuffle,
    draw: drawCards,
    reset: resetAll
  };

  document.addEventListener('DOMContentLoaded', init);
})();

</script>
</body>
</html>
